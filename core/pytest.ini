[pytest]
# Pytest configuration for FactoryLM

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    -ra

# Coverage options (when running with --cov)
# Run: pytest --cov=src/factorylm --cov-report=term-missing

# Markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (may require external services)
    slow: Slow tests (skip with -m "not slow")

# Minimum version
minversion = 7.0

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Asyncio mode
asyncio_mode = auto
