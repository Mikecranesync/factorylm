name: factorylm-cmms
services:
  postgres:
    image: postgres:16-alpine
    container_name: cmms_db
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PWD}
    ports:
      - "5433:5432"
    volumes:
      - cmms_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    
  api:
    image: intelloop/atlas-cmms-backend
    container_name: cmms-backend
    depends_on:
      - postgres
      - minio
    volumes:
      - ./logo:/app/static/images
    environment:
      DB_URL: cmms_db/atlas
      DB_USER: ${POSTGRES_USER}
      DB_PWD: ${POSTGRES_PWD}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8082}
      PUBLIC_FRONT_URL: ${PUBLIC_FRONT_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: atlas-bucket
      MINIO_ACCESS_KEY: ${MINIO_USER}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD}
      STORAGE_TYPE: ${STORAGE_TYPE:-minio}
      PUBLIC_MINIO_ENDPOINT: ${PUBLIC_MINIO_ENDPOINT:-http://localhost:9002}
      INVITATION_VIA_EMAIL: ${INVITATION_VIA_EMAIL:-false}
      ENABLE_EMAIL_NOTIFICATIONS: ${ENABLE_EMAIL_NOTIFICATIONS:-false}
      ENABLE_SSO: ${ENABLE_SSO:-false}
      HUB_SSO_SECRET: ${HUB_SSO_SECRET:-}
      HUB_SSO_ISSUER: ${HUB_SSO_ISSUER:-factorylm-hub}
      HUB_SSO_AUDIENCE: ${HUB_SSO_AUDIENCE:-atlas-cmms}
      LICENSE_KEY: ${LICENSE_KEY:-}
      LICENSE_FINGERPRINT_REQUIRED: ${LICENSE_FINGERPRINT_REQUIRED:-false}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      ENABLE_CORS: ${ENABLE_CORS:-true}
    ports:
      - "8082:8080"
    restart: unless-stopped
    
  frontend:
    image: intelloop/atlas-cmms-frontend
    container_name: cmms-frontend
    environment:
      API_URL: http://165.245.138.91:8082
      GOOGLE_KEY: ""
      GOOGLE_TRACKING_ID: ""
      MUI_X_LICENSE: ""
      INVITATION_VIA_EMAIL: "false"
      CLOUD_VERSION: "false"
      NODE_ENV: production
      ENABLE_SSO: "false"
      OAUTH2_PROVIDER: ""
      LOGO_PATHS: ""
      CUSTOM_COLORS: ""
      BRAND_CONFIG: ""
      DEMO_LINK: ""
      PADDLE_SECRET_TOKEN: ""
      PADDLE_ENVIRONMENT: sandbox
    ports:
      - "3003:3000"
    depends_on:
      - api
    restart: unless-stopped
    
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: cmms_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - cmms_minio_data:/data
    ports:
      - "9002:9000"
      - "9003:9001"
    command: server --address ":9000" --console-address ":9001" /data
    restart: unless-stopped

volumes:
  cmms_postgres_data:
  cmms_minio_data:
