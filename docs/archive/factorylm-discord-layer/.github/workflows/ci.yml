name: CI — Discord Layer

on:
  push:
    paths:
      - "services/factorylm-discord-layer/**"
  pull_request:
    paths:
      - "services/factorylm-discord-layer/**"

defaults:
  run:
    working-directory: services/factorylm-discord-layer

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Run tests
        run: pytest tests/ -v --cov=factorylm --cov-report=term-missing
