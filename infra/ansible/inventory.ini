# FactoryLM Mac Mini Fleet — Ansible Inventory
# Connects over Tailscale SSH. LAN IPs used for services (see CLUSTER.md).
#
# Usage: ansible-playbook -i inventory.ini playbook.yml
#
# Tailscale IPs refreshed 2026-04-24 — prior values (100.108.19.94, 100.82.246.52)
# belonged to retired hardware (offline 41–54 days on the tailnet).

[mac_minis]
alpha    ansible_host=100.107.140.12  ansible_user=factorylm
bravo    ansible_host=100.86.236.11   ansible_user=bravonode
charlie  ansible_host=100.70.49.126   ansible_user=charlienode

[mac_minis:vars]
ansible_python_interpreter=/opt/homebrew/bin/python3
