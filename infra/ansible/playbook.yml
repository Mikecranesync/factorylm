---
# FactoryLM Mac Mini Fleet Sync
# Ensures all 3 Mac minis have identical tooling, packages, and config.
#
# Usage:
#   ansible-playbook -i inventory.ini playbook.yml              # all nodes
#   ansible-playbook -i inventory.ini playbook.yml --limit bravo # single node
#   ansible-playbook -i inventory.ini playbook.yml --check       # dry run

- name: Sync Mac minis to identical state
  hosts: mac_minis
  become: false

  vars:
    repo_url: "https://github.com/Mikecranesync/factorylm.git"
    repo_path: "{{ ansible_env.HOME }}/factorylm"
    active_branch: "main"

    pip_packages:
      - pymodbus
      - requests
      - qdrant-client
      - ollama
      - fastmcp
      - langgraph
      - langchain-core
      - llama-cloud
      - unstructured
      - mem0ai
      - psycopg2-binary

    npm_packages:
      - "@anthropic-ai/claude-code"

    env_vars:
      ANTHROPIC_MODEL: "sonnet"
      CLAUDE_CODE_SUBAGENT_MODEL: "haiku"
      N8N_URL: "http://localhost:5678"

  tasks:
    # --- NOPASSWD sudo setup ---
    - name: Ensure NOPASSWD sudo for current user
      become: true
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ ansible_user }}"
        content: "{{ ansible_user }} ALL=(ALL) NOPASSWD: ALL\n"
        mode: "0440"
        validate: "visudo -cf %s"

    # --- Homebrew ---
    - name: Update Homebrew
      ansible.builtin.shell: brew update
      changed_when: false

    - name: Copy Brewfile to remote
      ansible.builtin.copy:
        src: Brewfile
        dest: "{{ ansible_env.HOME }}/Brewfile"
        mode: "0644"

    - name: Install Brewfile packages
      ansible.builtin.shell: brew bundle --file={{ ansible_env.HOME }}/Brewfile
      register: brew_result
      changed_when: "'Installing' in brew_result.stdout"

    # --- Node / Claude Code ---
    - name: Install Claude Code CLI
      ansible.builtin.shell: npm install -g @anthropic-ai/claude-code
      args:
        creates: /opt/homebrew/bin/claude

    # --- Python packages ---
    - name: Install pip packages
      ansible.builtin.pip:
        name: "{{ pip_packages }}"
        state: present
        executable: pip3

    # --- Clone / update repo ---
    - name: Clone or update factorylm repo
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ repo_path }}"
        version: "{{ active_branch }}"
        update: true
        accept_hostkey: true

    # --- Run bootstrap.sh for node identity ---
    - name: Run cluster bootstrap
      ansible.builtin.command:
        cmd: bash bootstrap.sh
        chdir: "{{ repo_path }}"
      register: bootstrap_result
      changed_when: "'Wrote' in bootstrap_result.stdout"

    # --- Environment variables (universal only) ---
    - name: Set universal env vars and aliases in .zshrc
      ansible.builtin.blockinfile:
        path: "{{ ansible_env.HOME }}/.zshrc"
        marker: "# {mark} MANAGED BY ANSIBLE - FACTORYLM"
        block: |
          # FactoryLM cluster config
          export ANTHROPIC_MODEL="{{ env_vars.ANTHROPIC_MODEL }}"
          export CLAUDE_CODE_SUBAGENT_MODEL="{{ env_vars.CLAUDE_CODE_SUBAGENT_MODEL }}"
          export N8N_URL="{{ env_vars.N8N_URL }}"
          alias factoryboot='cd ~/factorylm && claude'
          alias fls='cd ~/factorylm && ls'
        create: true

    # --- tmux ---
    - name: Deploy tmux config
      ansible.builtin.copy:
        src: tmux.conf
        dest: "{{ ansible_env.HOME }}/.tmux.conf"
        mode: "0644"

    - name: Add tmux auto-attach for SSH sessions
      ansible.builtin.blockinfile:
        path: "{{ ansible_env.HOME }}/.zshrc"
        marker: "# {mark} MANAGED BY ANSIBLE - TMUX"
        block: |
          if [[ -n "$SSH_TTY" ]] && [[ -z "$TMUX" ]]; then
            tmux attach-session -t main || tmux new-session -s main
          fi
        create: true

    # --- SSH / Remote Login ---
    - name: Enable remote login
      become: true
      ansible.builtin.command: systemsetup -setremotelogin on
      changed_when: false

    # --- Claude directory ---
    - name: Create Claude config directory
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.claude"
        state: directory
        mode: "0755"

    # =====================================================================
    # Cluster SSH + Claude Code permission sync (added 2026-04-24)
    # Makes every Mac mini Tailscale-first and lets Claude Code run ssh /
    # tailscale / rsync without a permission prompt on each session.
    # =====================================================================

    # --- Ensure ~/.ssh exists with correct perms ---
    - name: Ensure ~/.ssh directory exists
      tags: [ssh_claude_sync, ssh]
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.ssh"
        state: directory
        mode: "0700"

    # --- Deploy cluster-canonical SSH config (Tailscale-first) ---
    - name: Deploy cluster-canonical SSH config
      tags: [ssh_claude_sync, ssh]
      ansible.builtin.template:
        src: templates/ssh_config.j2
        dest: "{{ ansible_env.HOME }}/.ssh/config"
        mode: "0600"
        backup: true

    # --- Drop the Claude Code permission-merger helper ---
    - name: Install Claude Code permission-merger helper
      tags: [ssh_claude_sync, claude_perms]
      ansible.builtin.copy:
        src: files/merge_claude_permissions.py
        dest: "{{ ansible_env.HOME }}/.claude/merge_claude_permissions.py"
        mode: "0755"

    # --- Merge canonical permission entries into ~/.claude/settings.json ---
    # Idempotent: marker file at ~/.claude/.permissions-merged-v<N> short-circuits.
    - name: Merge canonical Claude Code permissions (ssh/tailscale/rsync/etc.)
      tags: [ssh_claude_sync, claude_perms]
      ansible.builtin.command:
        cmd: "/usr/bin/env python3 {{ ansible_env.HOME }}/.claude/merge_claude_permissions.py"
      args:
        creates: "{{ ansible_env.HOME }}/.claude/.permissions-merged-v1"
      register: claude_perms_merge
      changed_when: "'merged:' in (claude_perms_merge.stdout | default(''))"
