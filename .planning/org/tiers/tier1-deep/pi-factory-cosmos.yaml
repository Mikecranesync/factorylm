outcomes:
- Serves live PLC tag snapshots over REST API (real hardware or simulator)
- Detects conveyor faults from tag patterns and classifies severity
- Diagnoses equipment issues using NVIDIA Cosmos Reason 2 (video + PLC data)
- Reads VFD registers over Modbus TCP with graceful degradation
- Tracks conveyor belt RPM via computer vision (orange tape tachometer)
- Pushes fault alerts to technicians via Telegram bot
- Runs hands-free demo cycles (normal -> warning -> fault -> recovery)
