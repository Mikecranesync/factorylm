meta:
  repo: factorylm
  org: Mikecranesync
  url: https://github.com/Mikecranesync/factorylm
  one_line: "Industrial AI monolith — PLC data, AI diagnosis, Telegram/WhatsApp bots, CMMS, conveyor lab, workers, gateway"
  primary_language: TypeScript
  is_fork: false
  is_archived: false
  last_pushed: "2026-03-06T00:33:35Z"
  tier: 1
  mapped_at: "2026-03-06"
  local_path: /Users/charlienode/factorylm

categories:
  - core
  - monolith
  - industrial
  - ai
  - messaging
  - maintenance

outcomes:
  - "Collects PLC data from Allen-Bradley, Siemens, and Modbus devices"
  - "Routes technician messages to AI models (Claude, Groq, Gemini, DeepSeek)"
  - "Diagnoses equipment faults using LLM + rule-based analysis"
  - "Manages maintenance work orders via CMMS web app"
  - "Orchestrates async workers for PLC sync, demos, quality gates"
  - "Serves interactive conveyor lab dashboard for Factory IO"
  - "Integrates Telegram and WhatsApp for field technician access"
  - "Records and retrieves industrial knowledge via vector KB"
  - "Simulates motor drives and conveyor systems for testing"

consolidation:
  status: standalone
  merged_into: null
  overlaps_with: []
  notes: "This IS the monolith. 5 repos already merged in (factorylm-core, factorylm-plc-client, factorylm-mini, mikes-brain, pi-gateway). Contains copies of openclaw, simulation/motulator. Largest repo — 2,097 source files."

