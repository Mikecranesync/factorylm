meta:
  repo: nautobot-docker-compose
  org: Mikecranesync
  url: https://github.com/Mikecranesync/nautobot-docker-compose
  one_line: "Fork of Nautobot Docker Compose with custom tools for FactoryLM industrial cluster network management and auto-discovery"
  primary_language: Python
  is_fork: true
  is_archived: false
  last_pushed: "2026-03-03T17:46:24Z"
  tier: 1
  mapped_at: "2026-03-06"
  local_path: /Users/charlienode/nautobot-docker-compose
categories:
  - network-management
  - industrial-automation
  - infrastructure
  - fork
outcomes:
  - "Runs Nautobot DCIM/IPAM as the network source of truth for the FactoryLM cluster"
  - "Auto-discovers and seeds 14 devices (PLCs, servers, VPSes, mobile) with IPs, interfaces, and Tailscale overlay"
  - "Continuously monitors device/service health and syncs status to Nautobot"
  - "Regenerates network-topology.md from live Nautobot data for cluster memory"
consolidation:
  status: standalone
  merged_into: null
  overlaps_with:
    - factorylm  # cluster memory and network-topology.md shared via SMB
  notes: "Runs on CHARLIE (192.168.1.12:8443). Custom tools/ directory is entirely Mike's addition -- the upstream repo has no tools/. The creds.env contains live credentials and API tokens."
file_tree:
  total_files: 43
  total_lines: 3428  # excluding poetry.lock (2619 lines) and binary/log files
  by_extension:
    py: 7
    yml: 10
    yaml: 1
    toml: 2
    md: 4
    env: 4
    json: 1
    Dockerfile: 2
    other: 12  # .gitignore, .dockerignore, CODEOWNERS, log files, png
  key_dirs:
    - tools/       # 6 custom Python scripts for cluster network management (Mike's additions)
    - environments/ # Docker Compose files, Dockerfiles, and env configs
    - config/      # Nautobot Django settings
    - plugins/     # Example plugin scaffold
    - jobs/        # Empty Nautobot jobs package
    - docs/        # SSL, LDAP, and plugin documentation
    - .github/     # CI workflow and CODEOWNERS
    - logs/        # Runtime health monitor logs
parts:
  - name: "Custom Cluster Tools"
    outcome: "Six Python scripts that seed, scan, monitor, and verify the FactoryLM industrial network topology in Nautobot"
    chapters:
      - name: "Topology Seeding"
        outcome: "Bootstraps Nautobot with the full FactoryLM device inventory, IP addresses, interfaces, and metadata"
        files:
          - path: tools/seed_topology.py
            kind: core-lib
            outcome: "Seeds initial 5-device LAN topology (charlie, pi-factory, micro820-1, gs10-vfd-1, sg605-sw-1) with interfaces, IPs, manufacturer/device-type/role records, and the 192.168.1.0/24 prefix"
            lines: 311
          - path: tools/seed_full_topology.py
            kind: core-lib
            outcome: "Seeds full 14-device topology across LAN, Tailscale, cloud, and mobile locations; fixes gs10-vfd-1 bad IP; creates Tailscale namespace/prefix; writes service comments on every device"
            lines: 518
      - name: "Health Monitoring"
        outcome: "Probes all cluster devices and services, updates Nautobot statuses, regenerates topology documentation"
        files:
          - path: tools/health_monitor.py
            kind: core-lib
            outcome: "Runs via launchd every 5 min on CHARLIE; pings/TCP-probes all 14 devices; patches Nautobot Active/Offline status on change; regenerates /Users/Shared/cluster/betterclaw/memory/network-topology.md from Nautobot API data"
            lines: 393
          - path: tools/scan_endpoints.py
            kind: core-lib
            outcome: "TCP/HTTP probes every known service port across 6 devices (30+ services); creates/updates Nautobot IPAM service records with dependency metadata and offline timestamps"
            lines: 388
      - name: "Network Discovery"
        outcome: "Auto-discovers hosts on the LAN via nmap and syncs findings to Nautobot"
        files:
          - path: tools/network_scan_to_nautobot.py
            kind: core-lib
            outcome: "Runs nmap ping-scan on 192.168.1.0/24, compares live IPs to Nautobot inventory, updates device statuses, and flags unknown hosts; designed for Pi edge node cron"
            lines: 184
      - name: "Verification"
        outcome: "Automated test suite validating the Nautobot topology matches expected cluster state"
        files:
          - path: tools/verify_nautobot.py
            kind: test
            outcome: "Runs 20 deterministic tests verifying device count, IP assignments, interface presence, topology file completeness, and service comments against Nautobot API"
            lines: 215

  - name: "Docker Compose Infrastructure"
    outcome: "Defines container stack (Nautobot, Celery, Redis, PostgreSQL/MySQL) with build, env, and compose layering"
    chapters:
      - name: "Compose Definitions"
        outcome: "Layered Docker Compose files for base services, database backends, LDAP, and local development overrides"
        files:
          - path: environments/docker-compose.base.yml
            kind: devops
            outcome: "Defines Nautobot app, Celery worker, Celery beat, and Redis services with health checks and YAML anchors for reuse"
            lines: 66
          - path: environments/docker-compose.postgres.yml
            kind: devops
            outcome: "Starts PostgreSQL 13 with health check, persistent volume, and env-based credentials"
            lines: 21
          - path: environments/docker-compose.mysql.yml
            kind: devops
            outcome: "Alternative MySQL 8 database backend with SHA2 auth and persistent volume"
            lines: 35
          - path: environments/docker-compose.local.yml
            kind: devops
            outcome: "Local development overrides: exposes port 8443, mounts config and jobs as volumes, adjusts health check"
            lines: 19
          - path: environments/docker-compose.ldap.yml
            kind: devops
            outcome: "LDAP variant of base compose file pointing to Dockerfile-LDAP for Active Directory auth"
            lines: 66
      - name: "Dockerfiles"
        outcome: "Multi-stage builds for Nautobot container images with optional LDAP support"
        files:
          - path: environments/Dockerfile
            kind: devops
            outcome: "Multi-stage Dockerfile: builds from nautobot-dev image, installs Poetry deps, copies jobs and config, produces final nautobot image with pyuwsgi SSL verification"
            lines: 70
          - path: environments/Dockerfile-LDAP
            kind: devops
            outcome: "LDAP variant Dockerfile: adds libldap2-dev/libsasl2-dev, installs django-auth-ldap, builds and installs all plugins as wheels"
            lines: 76
      - name: "Environment Files"
        outcome: "Configuration and secrets for Docker container runtime"
        files:
          - path: environments/local.env
            kind: config
            outcome: "Live local env for CHARLIE node: sets banner to 'FactoryLM - CHARLIE Node', enables debug/metrics, configures DB and Redis hosts"
            lines: 23
          - path: environments/local.example.env
            kind: config
            outcome: "Template local env with placeholder values, LDAP vars, and MySQL settings for new deployments"
            lines: 39
          - path: environments/creds.env
            kind: config
            outcome: "Live credentials: DB password, Redis password, secret key, superuser account, and API token for FactoryLM Nautobot instance"
            lines: 17
          - path: environments/creds.example.env
            kind: config
            outcome: "Template credentials file with 'changeme' placeholders for safe git distribution"
            lines: 24

