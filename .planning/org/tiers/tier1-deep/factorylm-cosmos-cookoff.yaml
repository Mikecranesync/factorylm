meta:
  repo: factorylm-cosmos-cookoff
  org: Mikecranesync
  url: https://github.com/Mikecranesync/factorylm-cosmos-cookoff
  one_line: Multimodal AI diagnostics for industrial conveyors — fuses PLC telemetry, VFD registers, camera vision, and Factory
    I/O simulation through NVIDIA Cosmos Reason 2
  primary_language: Python
  is_fork: false
  is_archived: false
  last_pushed: '2026-03-05T09:22:54Z'
  tier: 1
  mapped_at: '2026-03-06'
  local_path: /Users/charlienode/factorylm-cosmos-cookoff
categories:
- industrial
- ai
- edge-gateway
- plc-connectivity
- computer-vision
- nvidia-cosmos
outcomes:
- Detect conveyor jams, belt slip, motor overload, E-stop, sensor failures, and overheat from live PLC/VFD registers
- Send video + PLC telemetry to NVIDIA Cosmos Reason 2 for chain-of-thought root-cause analysis
- Vision-based belt tachometer measures RPM, speed, and lateral tracking via orange tape marker
- Auto-discover PLCs on subnet via Modbus TCP, EtherNet/IP, and OPC UA waterfall scan
- Pi Factory edge gateway with setup wizard, WiFi provisioning, and CompactCom Modbus server
- Live dashboard with speed fusion bars, fault injection, Cosmos R2 reasoning panel, and MJPEG belt stream
- 'Video highlight reel pipeline: ingest raw clips, Cosmos-score them, select top N, concatenate with overlays'
consolidation:
  status: standalone
  merged_into: null
  overlaps_with:
  - factorylm
  - pi-factory-cosmos
  - openclaw
  notes: 'Internal duplication: diagnosis/conveyor_faults.py mirrors net/diagnosis/conveyor_faults.py. Shares fault classifier,
    frame_capture, belt tachometer with pi-factory-cosmos. Edge gateway overlaps monolith services. Partial merge candidate.'
