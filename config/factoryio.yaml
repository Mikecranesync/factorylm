# Factory I/O Bridge Configuration
# Connects Factory I/O (or real PLC) to FactoryLM Matrix API via Modbus TCP.

factoryio:
  # Modbus TCP connection
  # Factory I/O binds to Tailscale adapter — use machine IP, not localhost
  host: "100.72.2.99"
  port: 502

  # Matrix API endpoint
  matrix_url: "http://localhost:8000"

  # Poll interval in milliseconds (200ms = 5 Hz, 100ms = 10 Hz)
  interval_ms: 200

  # Incident source: "sim" uses built-in PLC simulator, "factoryio" uses Modbus
  # This controls which data source the bridge uses when started without --sim flag.
  incident_source: "factoryio"

  # Recommended Factory I/O scene: "Sorting by Height" or "From A to B"
  # These scenes have conveyors, photoeye sensors, and jams you can trigger.
  scene: "Sorting by Height (Basic)LLM"

  # Tag map: Modbus addresses as mapped in the scene XML.
  # Scene XML was patched to copy ModbusTCPClient mappings to ModbusTCPServer.
  # Modbus Server uses discrete inputs (read) and coils (write).
  #
  # NOTE: Factory I/O Modbus Server exposes sensors as DISCRETE INPUTS
  # (function code 2, read_discrete_inputs) and actuators as COILS
  # (function code 1/5/15, read_coils/write_single_coil/write_multiple_coils).

  # Discrete Inputs (sensors — read-only)
  discrete_inputs:
    0: high_sensor          # Height detection sensor
    1: low_sensor           # Low item sensor
    2: pallet_sensor        # Pallet at position
    3: loaded               # Item loaded on pallet
    4: at_left_entry        # Left conveyor entry photoeye
    5: at_left_exit         # Left conveyor exit photoeye
    6: at_right_entry       # Right conveyor entry photoeye
    7: at_right_exit        # Right conveyor exit photoeye
    8: start_button         # Start pushbutton
    9: reset_button         # Reset pushbutton
    10: stop_button         # Stop pushbutton
    11: e_stop              # Emergency stop
    12: auto_mode           # Auto/manual selector
    13: fio_running         # Factory I/O sim running state

  # Coils (actuators — read/write)
  coils:
    0: conveyor_entry       # Entry conveyor motor
    1: load                 # Loader actuator
    2: unload               # Unloader actuator
    3: transfer_left        # Left transfer
    4: transfer_right       # Right transfer
    5: conveyor_left        # Left branch conveyor
    6: conveyor_right       # Right branch conveyor
    7: start_light          # Start indicator lamp
    8: reset_light          # Reset indicator lamp
    9: stop_light           # Stop indicator lamp

  # Holding Register (numeric output)
  registers:
    0: counter              # Item counter value
