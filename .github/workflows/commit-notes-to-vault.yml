name: Commit Notes to Vault

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  commit-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout factorylm
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout vault
        uses: actions/checkout@v4
        with:
          repository: Mikecranesync/FactoryLM_OS
          token: ${{ secrets.VAULT_PAT }}
          path: vault

      - name: Generate commit note
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          TIME=$(date -u +%H:%M)
          FILE="vault/10_Commit_Notes/${DATE}.md"
          SHORT_SHA=$(echo "$AFTER_SHA" | cut -c1-7)

          COMMITS=$(git log "${BEFORE_SHA}..${AFTER_SHA}" \
            --pretty=format:'| `%h` | %s | %an |' \
            2>/dev/null || true)

          if [ -z "$COMMITS" ]; then
            COMMITS=$(git log -1 --pretty=format:'| `%h` | %s | %an |')
          fi

          COMMIT_COUNT=$(echo "$COMMITS" | wc -l | tr -d ' ')

          HEADER="## Push at ${TIME} UTC

          **Trigger:** \`${SHORT_SHA}\` on \`main\`
          **Commits:** ${COMMIT_COUNT}

          | Hash | Message | Author |
          |------|---------|--------|
          ${COMMITS}"

          # Strip leading whitespace from indented heredoc
          HEADER=$(echo "$HEADER" | sed 's/^          //')

          if [ -f "$FILE" ]; then
            printf '\n---\n\n%s\n' "$HEADER" >> "$FILE"
          else
            {
              echo "---"
              echo "title: \"Commit Notes - ${DATE}\""
              echo "date: ${DATE}"
              echo "tags: [type/commit-note, project/factorylm]"
              echo "status: active"
              echo "---"
              echo ""
              echo "# Commit Notes - ${DATE}"
              echo ""
              echo "$HEADER"
            } > "$FILE"
          fi

      - name: Push to vault
        run: |
          cd vault
          git config user.name "factorylm-bot"
          git config user.email "bot@factorylm.dev"
          git add 10_Commit_Notes/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: commit notes from factorylm $(date -u +%Y-%m-%d)"
            git push || {
              echo "::warning::Vault push failed; FactoryLM_OS may be archived or read-only. Skipping non-blocking note export."
              exit 0
            }
          fi
