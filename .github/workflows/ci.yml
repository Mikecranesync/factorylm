name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Lint: ruff across all Python source trees
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint core/src
        run: ruff check core/src/

      - name: Lint services/plc-modbus/src
        run: ruff check services/plc-modbus/src/

      - name: Lint cosmos
        run: ruff check cosmos/

  # ---------------------------------------------------------------------------
  # Test core: factorylm LLM abstraction library
  # Uses setup.py dev extras which include pytest + asyncio support.
  # API-dependent tests are skipped by default (no real keys in CI).
  # ---------------------------------------------------------------------------
  test-core:
    name: Test core (unit)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install core package with dev extras
        run: |
          cd core
          pip install -e ".[dev]"

      - name: Run unit tests (skip integration requiring live APIs)
        run: |
          cd core
          pytest tests/unit/ -v -m "not integration" --tb=short

  # ---------------------------------------------------------------------------
  # Test plc-modbus: Modbus/PLC client library
  # Uses pyproject.toml dev extras.  Hardware tests require real PLC — skip in CI.
  # ---------------------------------------------------------------------------
  test-plc:
    name: Test plc-modbus (unit, no hardware)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install plc-modbus package with dev extras
        run: |
          cd services/plc-modbus
          pip install -e ".[dev]"

      - name: Run unit tests (skip hardware-dependent tests)
        run: |
          cd services/plc-modbus
          pytest tests/unit/ -v -m "not hardware" --tb=short
