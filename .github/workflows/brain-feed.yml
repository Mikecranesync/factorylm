name: Feed Open Brain
on:
  push:
    branches: ["**"]

jobs:
  brain-ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Send commit to Open Brain
        if: env.BRAIN_INGEST_URL != ''
        env:
          BRAIN_INGEST_URL: ${{ secrets.BRAIN_INGEST_URL }}
        run: |
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          AUTHOR="${{ github.event.head_commit.author.name }}"
          SHA="${{ github.sha }}"
          FILES=$(git diff-tree --no-commit-id -r --name-only HEAD | tr '\n' ', ')

          # Use jq to safely encode the commit message (handles newlines, quotes)
          MSG=$(jq -Rs '.' <<< "${{ github.event.head_commit.message }}")

          jq -n \
            --arg content "Git commit in $REPO on $BRANCH by $AUTHOR: $(echo ${{ github.event.head_commit.message }} | head -1) | Changed files: $FILES" \
            --arg sha "$SHA" \
            --arg repo "$REPO" \
            --arg branch "$BRANCH" \
            --arg author "$AUTHOR" \
            --arg files "$FILES" \
            '{
              content: $content,
              source: "github_commit",
              tags: ["git", "commit", $repo],
              metadata: { sha: $sha, repo: $repo, branch: $branch, author: $author, files: $files }
            }' | curl -sf -X POST "$BRAIN_INGEST_URL" \
              -H "Content-Type: application/json" \
              -d @- || echo "Brain ingest unavailable (server may be offline)"
