name: CI Watchdog
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  issues: write
  actions: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check brain-ingest endpoint
        id: health
        env:
          BRAIN_INGEST_URL: ${{ secrets.BRAIN_INGEST_URL }}
        run: |
          if [ -z "$BRAIN_INGEST_URL" ]; then
            echo "status=no_secret" >> "$GITHUB_OUTPUT"
            echo "::warning::BRAIN_INGEST_URL secret not configured"
            exit 0
          fi
          BASE_URL=$(echo "$BRAIN_INGEST_URL" | sed 's|/ingest$||')
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            --connect-timeout 5 --max-time 10 \
            "${BASE_URL}/health" || echo "000")
          echo "status=$HTTP_CODE" >> "$GITHUB_OUTPUT"
          echo "Brain ingest health: HTTP $HTTP_CODE"

      - name: Check recent workflow failures
        id: failures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SINCE=$(date -u -d '6 hours ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null \
            || date -u -v-6H +%Y-%m-%dT%H:%M:%SZ)
          FAIL_COUNT=$(gh api "repos/${{ github.repository }}/actions/runs" \
            --jq "[.workflow_runs[] | select(.name==\"Feed Open Brain\" and .conclusion==\"failure\" and .created_at > \"$SINCE\")] | length" \
            2>/dev/null || echo "0")
          echo "fail_count=$FAIL_COUNT" >> "$GITHUB_OUTPUT"
          echo "Brain-feed failures (last 6h): $FAIL_COUNT"

      - name: Classify severity
        id: severity
        run: |
          STATUS="${{ steps.health.outputs.status }}"
          FAILS="${{ steps.failures.outputs.fail_count }}"
          if [ "$STATUS" = "000" ] && [ "${FAILS:-0}" -gt 10 ]; then
            echo "level=CRITICAL" >> "$GITHUB_OUTPUT"
            echo "msg=Brain ingest DOWN, $FAILS failures in 6h" >> "$GITHUB_OUTPUT"
          elif [ "$STATUS" = "000" ] || [ "$STATUS" = "no_secret" ]; then
            echo "level=WARN" >> "$GITHUB_OUTPUT"
            echo "msg=Brain ingest unreachable, $FAILS failures" >> "$GITHUB_OUTPUT"
          elif [ "${FAILS:-0}" -gt 0 ]; then
            echo "level=INFO" >> "$GITHUB_OUTPUT"
            echo "msg=Brain ingest healthy but $FAILS recent failures (recovering)" >> "$GITHUB_OUTPUT"
          else
            echo "level=OK" >> "$GITHUB_OUTPUT"
            echo "msg=All systems nominal" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update issue on failure
        if: steps.severity.outputs.level == 'CRITICAL' || steps.severity.outputs.level == 'WARN'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="[CI Watchdog] Brain ingest: ${{ steps.severity.outputs.level }}"
          BODY="**Severity:** ${{ steps.severity.outputs.level }}
          **Status:** ${{ steps.severity.outputs.msg }}
          **Health HTTP:** ${{ steps.health.outputs.status }}
          **Failures (6h):** ${{ steps.failures.outputs.fail_count }}
          **Detected:** $(date -u +%Y-%m-%dT%H:%M:%SZ)

          ### Playbook
          1. SSH to VPS: \`ssh root@100.68.120.99\`
          2. Check service: \`systemctl status brain-ingest\`
          3. Check logs: \`journalctl -u brain-ingest -n 30\`
          4. Restart: \`systemctl restart brain-ingest\`
          5. Verify: \`curl -sf http://localhost:8500/health\`
          6. If still down, check env: \`cat /opt/openclaw/.env.brain\`

          _Auto-generated by CI Watchdog_"
          BODY=$(echo "$BODY" | sed 's/^          //')
          EXISTING=$(gh issue list --label "ci-watchdog" --state open \
            --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label "ci-watchdog"
          fi

      - name: Close issue if recovered
        if: steps.severity.outputs.level == 'OK'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING=$(gh issue list --label "ci-watchdog" --state open \
            --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" \
              --body "Resolved: Brain ingest is healthy. Auto-closing."
            gh issue close "$EXISTING"
          fi
