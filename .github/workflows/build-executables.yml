name: Build Executables

on:
  push:
    branches: [main]
    paths:
      - 'apps/plc-reader/**'
      - '_BUILDS/plc-reader/**'
      - 'packages/factorylm-cli/src/**'
      - 'apps/github-scraper/**'
      - '_BUILDS/github-scraper/**'
  workflow_dispatch:

jobs:
  # ================================================================
  #  PLC Reader — Windows
  # ================================================================
  build-windows-plc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install -r _BUILDS/plc-reader/requirements.txt

      - name: Build Windows .exe
        working-directory: _BUILDS/plc-reader
        run: |
          python -m PyInstaller --name "PLC-Reader" --onefile --windowed --collect-all nicegui --exclude-module matplotlib --exclude-module scipy --exclude-module pandas --add-data "../../apps/plc-reader;plc_reader" --add-data "../../packages/factorylm-cli/src;plc_lib" main.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: PLC-Reader-Windows
          path: _BUILDS/plc-reader/dist/PLC-Reader.exe
          retention-days: 30

  # ================================================================
  #  PLC Reader — macOS
  # ================================================================
  build-mac-plc:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install -r _BUILDS/plc-reader/requirements.txt

      - name: Build macOS .app
        working-directory: _BUILDS/plc-reader
        run: |
          python -m PyInstaller --name "PLC-Reader" --onefile --windowed --collect-all nicegui --exclude-module matplotlib --exclude-module scipy --exclude-module pandas --add-data "../../apps/plc-reader:plc_reader" --add-data "../../packages/factorylm-cli/src:plc_lib" main.py

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: PLC-Reader-macOS
          path: _BUILDS/plc-reader/dist/PLC-Reader
          retention-days: 30

  # ================================================================
  #  GitHub Scraper — Windows
  # ================================================================
  build-windows-scraper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyinstaller appdirs
          pip install -r _BUILDS/github-scraper/requirements.txt

      - name: Build Windows .exe
        working-directory: _BUILDS/github-scraper
        run: |
          python -m PyInstaller --name "GitHub-Scraper" --onefile --windowed --collect-all nicegui --hidden-import appdirs --exclude-module matplotlib --exclude-module scipy --exclude-module pandas --exclude-module pymodbus --exclude-module snap7 --add-data "../../apps/github-scraper;github_scraper" --add-data "../../_BUILDS/shared/token_loader.py;." main.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: GitHub-Scraper-Windows
          path: _BUILDS/github-scraper/dist/GitHub-Scraper.exe
          retention-days: 30

  # ================================================================
  #  GitHub Scraper — macOS
  # ================================================================
  build-mac-scraper:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyinstaller appdirs
          pip install -r _BUILDS/github-scraper/requirements.txt

      - name: Build macOS .app
        working-directory: _BUILDS/github-scraper
        run: |
          python -m PyInstaller --name "GitHub-Scraper" --onefile --windowed --collect-all nicegui --hidden-import appdirs --exclude-module matplotlib --exclude-module scipy --exclude-module pandas --exclude-module pymodbus --exclude-module snap7 --add-data "../../apps/github-scraper:github_scraper" --add-data "../../_BUILDS/shared/token_loader.py:." main.py

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: GitHub-Scraper-macOS
          path: _BUILDS/github-scraper/dist/GitHub-Scraper
          retention-days: 30

  # ================================================================
  #  Summary
  # ================================================================
  summary:
    needs: [build-windows-plc, build-mac-plc, build-windows-scraper, build-mac-scraper]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Build Summary
        run: |
          echo "## Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Executable | Windows | macOS |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| PLC Reader | ${{ needs.build-windows-plc.result }} | ${{ needs.build-mac-plc.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| GitHub Scraper | ${{ needs.build-windows-scraper.result }} | ${{ needs.build-mac-scraper.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download artifacts from the **Actions** tab above." >> $GITHUB_STEP_SUMMARY
