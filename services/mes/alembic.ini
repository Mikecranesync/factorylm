[alembic]
script_location = alembic
prepend_sys_path = .

# Use FACTORYLM_DATABASE_URL env var (set via Doppler or docker-compose)
# Override from backend/config.py via env.py
sqlalchemy.url = postgresql://mes:meslocal@localhost:5434/mes_core

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
