[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "factorylm-discord-layer"
version = "0.1.0"
description = "Discord communication layer for the FactoryLM agent swarm."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["discord", "factory", "plc", "agents", "webhooks"]
dependencies = [
    "aiohttp>=3.9",
    "pydantic>=2.0",
    "tomli>=2.0;python_version<'3.11'",
    "python-telegram-bot>=20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.3",
]

[project.scripts]
factorylm-setup = "factorylm.setup.discord_setup:cli_main"
factorylm-relay = "factorylm.relay.daemon:cli_main"
factorylm-bot = "factorylm.bot.commands:cli_main"

[project.urls]
Homepage = "https://github.com/Mikecranesync/factorylm"
Issues = "https://github.com/Mikecranesync/factorylm/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
